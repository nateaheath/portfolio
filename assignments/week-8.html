<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Week 8: Photography | Nathanael Heath</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0A0D0F;
      --text: #dfeaf0;
      --purple: #C4BFD8;
      --line: rgba(196, 191, 216, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 6px;
    }

    .page {
      width: min(1280px, 90%);
      margin-inline: auto;
    }

    .page-header,
    .page-footer {
      padding-block: 28px;
    }

    .page-header {
      border-bottom: 1px solid var(--line);
    }

    .page-footer {
      border-top: 1px solid var(--line);
    }

    .back-link {
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    .intro {
      padding-block: 75px 60px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 92px);
      line-height: 1;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .description {
      max-width: 620px;
      margin-top: 28px;
      font-size: 16px;
      line-height: 1.8;
    }

    .assignment-note {
      margin-top: 22px;
      color: var(--purple);
      font-size: 13px;
      line-height: 1.7;
    }

    /* Staggered gallery with uncropped photographs */
    .photo-gallery {
      columns: 3;
      column-gap: 35px;
      padding-block: 15px 30px;
    }

    .photo {
      display: inline-block;
      width: 100%;
      margin: 0 0 55px;
      break-inside: avoid;
      vertical-align: top;
    }

    .photo-link {
      display: block;
      cursor: zoom-in;
      text-decoration: none;
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }

    .photo figcaption {
      margin-top: 15px;
      color: var(--purple);
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    .photo- {
      display: block;
      font-weight: 700;
    }

    .photo-details {
      display: block;
      font-weight: 400;
    }

    /* Subtle movement as photographs enter view */
    .motion-enabled .photo {
      opacity: 0;
      transform: translateY(24px);
      transition:
        opacity 800ms ease,
        transform 1000ms ease;
    }

    .motion-enabled .photo.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .more-works {
      padding: 45px 0 60px;
      color: var(--purple);
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .more-works a {
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Enlarged image overlay */
    .image-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 24px;
      border: 0;
      background: rgba(10, 13, 15, 0.95);
      color: var(--purple);
    }

    .image-viewer[open] {
      display: grid;
      place-items: center;
    }

    .image-viewer::backdrop {
      background: rgba(10, 13, 15, 0.8);
    }

    .viewer-content {
      max-width: 94vw;
      margin: 0;
      text-align: center;
    }

    .viewer-content img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 80vh;
      margin-inline: auto;
      object-fit: contain;
    }

    .viewer-content figcaption {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .viewer-hint {
      margin: 10px 0 0;
      font-size: 11px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .photo-gallery {
        columns: 2;
        column-gap: 24px;
      }
    }

    @media (max-width: 550px) {
      .intro {
        padding-block: 50px 35px;
      }

      .photo-gallery {
        columns: 1;
      }

      .photo {
        margin-bottom: 40px;
      }

      .more-works {
        padding-block: 25px 45px;
      }

      .image-viewer {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-enabled .photo,
      .motion-enabled .photo.is-visible {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

    .photo-gallery {
  columns: auto;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 55px 35px;
  align-items: start;
}

.photo {
  display: block;
  min-width: 0;
  margin: 0;
}

@media (max-width: 900px) {
  .photo-gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 550px) {
  .photo-gallery {
    grid-template-columns: 1fr;
  }
}
    
  </style>
</head>

<body>

          </a>
          <figcaption>
            <span class="photo-title">Photograph 3</span>

        </figure>

        <!-- PHOTO 4 -->
        <figure class="photo">
          <a class="photo-link" href="../images/photo-4.jpg">
            <img
              src="../images/photo-4.jpg"

        <!-- PHOTO 5 -->

      <section class="more-works" aria-label="More artwork">

    </main>

    <footer class="page-footer">
      <a class="back-link" href="../index.html#assignments">
        ← Back to assignments
      </a>
    </footer>

  </div>

  <dialog
    class="image-viewer"
    aria-label="Enlarged photograph"
    aria-describedby="viewer-hint"
  >
    <button class="visually-hidden" id="close-viewer" type="button" autofocus>
      Close enlarged photograph
    </button>

    <figure class="viewer-content">
      <img id="viewer-image" alt="">
      <figcaption id="viewer-caption"></figcaption>
      <p class="viewer-hint" id="viewer-hint">
        Click outside the photograph or press Escape to return.
      </p>
    </figure>
  </dialog>

  <script>
    // Reveal photographs as they enter the screen.
    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    if ("IntersectionObserver" in window && !reducedMotion.matches) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0,
        rootMargin: "0px 0px -30px 0px"
      });

      document.documentElement.classList.add("motion-enabled");

      document.querySelectorAll(".photo").forEach((photo) => {
        observer.observe(photo);
      });
    }

    // Open photographs in the same page without an X button.
    const viewer = document.querySelector(".image-viewer");
    const viewerImage = document.getElementById("viewer-image");
    const viewerCaption = document.getElementById("viewer-caption");
    const closeButton = document.getElementById("close-viewer");
    let previousOverflow = "";

    if (typeof viewer.showModal === "function") {
      document.querySelectorAll(".photo-link").forEach((link) => {
        link.addEventListener("click", (event) => {
          // Preserve opening in a new tab with keyboard modifiers.
          if (
            event.ctrlKey || event.metaKey ||
            event.shiftKey || event.altKey
          ) return;

          event.preventDefault();

          const photo = link.closest(".photo");

          viewerImage.src = link.href;
          viewerImage.alt = link.querySelector("img").alt;
          viewerCaption.textContent =
            photo.querySelector("figcaption").innerText;

          previousOverflow = document.body.style.overflow;
          viewer.showModal();
          document.body.style.overflow = "hidden";
        });
      });

      viewer.addEventListener("click", (event) => {
        if (event.target === viewer) viewer.close();
      });

      closeButton.addEventListener("click", () => viewer.close());

      viewer.addEventListener("close", () => {
        document.body.style.overflow = previousOverflow;
        viewerImage.removeAttribute("src");
      });
    }
  </script>
</body>
</html>
